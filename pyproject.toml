[project]
name = "hfplayground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "setuptools",
    "ninja",
    "packaging",
    "huggingface-hub[hf-transfer]>=0.28.1",
    "invoke>=2.2.0",
    "ipython>=8.32.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.0",
    "nilearn>=0.11.1",
    "numpy>=2.2.2",
    "pandas>=2.2.3",
    "pyarrow>=19.0.0",
    "seaborn>=0.13.2",
    "torch>=2.6.0",
    "torchvision",
    "torchaudio",
    "transformers[torch]>=4.48.3",
    "brainharmonix",
    "evaluate>=0.4.4",
    "click>=8.2.1",
    "timm>=1.0.24",
    "einops>=0.8.1",
    "flash-attn>=2.7.4.post1",
    "datasets>=3.2.0",
]

[project.optional-dependencies]
build = ["torch", "setuptools", "packaging"]

[tool.uv]
no-build-isolation-package = ["flash_attn"]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version="2.7.4"
requires-dist = ["torch", "einops"]

[tool.uv.sources]
brainharmonix = { git = "https://github.com/MedARC-AI/Brain-Harmony.git", rev = "5398f8f5540222973cf82d13ac1eb4c4b38af636" }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
